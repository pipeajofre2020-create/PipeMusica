# Pipe Música: compila el APK en los servidores de GitHub.
# Se ejecuta solo al subir cambios a "main", o a mano desde la pestaña Actions.
name: Compilar Pipe Música

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleIzzyRelease --warning-mode summary

      - name: Preparar la llave de firma
        env:
          PIPE_KEYSTORE: ${{ secrets.PIPE_KEYSTORE }}
        run: |
          if [ -n "$PIPE_KEYSTORE" ]; then
            echo "$PIPE_KEYSTORE" | base64 -d > pipe.keystore
          else
            echo "::warning::No encontré el secreto PIPE_KEYSTORE. Uso una llave temporal: para instalar la próxima versión tendrás que desinstalar esta primero."
            keytool -genkeypair -keystore pipe.keystore -storepass pipemusica -keypass pipemusica \
              -alias pipe -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pipe Musica"
          fi

      - name: Firmar APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/izzy/release/*.apk | head -1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks pipe.keystore --ks-pass pass:pipemusica --key-pass pass:pipemusica \
            --ks-key-alias pipe --out PipeMusica.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify PipeMusica.apk

      - name: Guardar el APK
        uses: actions/upload-artifact@v7
        with:
          name: PipeMusica
          path: PipeMusica.apk
